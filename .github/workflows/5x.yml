name: Build 5x dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ive/**'
      - '.github/workflows/5x.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 5x
        uses: actions/checkout@v4

      - name: Checkout upstream H5GG
        run: git clone --recursive --depth 1 https://github.com/H5GG/H5GG.git upstream

      - name: Install Theos
        run: |
          brew install ldid xz || true
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Integrate ive 5x
        run: |
          cp ive/5x.mm upstream/5x.mm
          python3 - <<'PY'
          from pathlib import Path

          tweak = Path('upstream/Tweak.mm')
          t = tweak.read_text(encoding='utf-8')

          anchor = 'h5ggEngine* h5gg = NULL;\n'
          inject = anchor + '#include "5x.mm"\n'
          if '#include "5x.mm"' not in t:
              if anchor not in t:
                  raise SystemExit('H5GG engine anchor not found')
              t = t.replace(anchor, inject, 1)

          init_anchor = 'void initload()\n{\n'
          ive_init = 'void initload()\n{\n    5xiveInit();\n    return;\n'
          if ive_init not in t:
              if init_anchor not in t:
                  raise SystemExit('initload anchor not found')
              t = t.replace(init_anchor, ive_init, 1)

          tweak.write_text(t, encoding='utf-8')

          # Current SDK compatibility for upstream cross-process headers.
          cp = Path('upstream/crossproc.h')
          c = cp.read_text(encoding='utf-8')
          preload = '''#include <sys/cdefs.h>
          #include <sys/_types.h>
          #include <sys/param.h>
          #include <sys/types.h>
          #include <sys/mount.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <net/if.h>
          #include <netinet/in.h>
          '''
          anchor2 = '#import <mach-o/dyld_images.h>\n'
          if preload not in c and anchor2 in c:
              c = c.replace(anchor2, anchor2 + preload, 1)
          cp.write_text(c, encoding='utf-8')

          lp = Path('upstream/ldid-master/ldid.cpp')
          l = lp.read_text(encoding='utf-8')
          guard = '#pragma clang diagnostic ignored "-Wmacro-redefined"\n#pragma clang diagnostic ignored "-Wunused-but-set-variable"\n'
          if guard not in l:
              l = guard + l
          lp.write_text(l, encoding='utf-8')

          mk = Path('upstream/Makefile')
          m = mk.read_text(encoding='utf-8')
          m = m.replace('TARGET = iphone:13.7:11.4', 'TARGET = iphone:clang:latest:11.0')
          m += '\nH5GG_CFLAGS += -Wno-error -Wno-module-import-in-extern-c -Wno-deprecated-declarations\n'
          m += 'H5GG_CCFLAGS += -Wno-error -Wno-macro-redefined -Wno-unused-but-set-variable -Wno-module-import-in-extern-c -Wno-deprecated-declarations\n'
          marker = 'H5GG_LOGOS_DEFAULT_GENERATOR = internal'
          if 'H5GG_FRAMEWORKS =' not in m:
              m = m.replace(marker, 'H5GG_FRAMEWORKS = UIKit Foundation JavaScriptCore SystemConfiguration CoreGraphics QuartzCore\n' + marker)
          mk.write_text(m, encoding='utf-8')
          PY

      - name: Verify ive integration
        run: |
          grep -q '#include "5x.mm"' upstream/Tweak.mm
          grep -q '5xiveInit();' upstream/Tweak.mm
          ! grep -q 'src/h5ggx.js' upstream/5x.mm

      - name: Build ARM64 5x
        working-directory: upstream
        run: |
          export THEOS="$HOME/theos"
          make clean
          make -j2

      - name: Collect dylib
        run: |
          mkdir -p output
          DYLIB=$(find upstream/.theos -type f -name 'H5GG.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" output/5x.dylib
          file output/5x.dylib
          ls -lh output/5x.dylib

      - name: Upload 5x dylib
        uses: actions/upload-artifact@v4
        with:
          name: 5x-ive-arm64
          path: output/5x.dylib
          if-no-files-found: error